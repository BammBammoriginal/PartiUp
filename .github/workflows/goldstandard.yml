name: PartiUp Goldstandard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partiup-gold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goldstandard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Read the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium

      - name: Check architecture and static gates
        run: npm run preflight

      - name: Check security and privacy flows
        run: npm run qa:security

      - name: Exercise desktop and mobile Goldstandard
        run: npm run qa:gold

      - name: Save browser evidence if a test fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gold-browser-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
